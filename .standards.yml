# .standards.yml — Project standards configuration
# Generated by coding-standards setup.sh
version: 1
languages:
  - go
agents:
  - codex
role: library
# Optional profiles — cross-cutting standards a project opts in to
# (shared-core: one logic core under native shells; ui-surface: platform-feel audit).
# profiles:
#   - shared-core
#   - ui-surface
coverage:
  minimum: 95
  domain: 100
tests:
  slow_threshold_ms: 2000
architecture: clean
security: strict
# Project text assembled into the agent configs ({{PROJECT_OVERVIEW}} /
# {{KEY_COMMANDS}}). Persist it here so re-assembly reproduces it and the
# checksum stays stable; /merge-standards fills it in.
project_overview: |
  Starboard is a Go CLI (`cmd/starboard`) that keeps a product's screen
  registry, flow documents and grey-box wireframes as plain text in a repo:
  `init`, `fmt`, `lint [--fix]`, `generate`, `render`, `schema`, `version`.
  The packages live under `internal/`; the version is injected into
  `internal/version.Version` at release time by GoReleaser (`.goreleaser.yaml`).
  `action.yml` is a composite GitHub Action that downloads a checksummed
  release and runs it. Releases follow docs/releasing.md.
key_commands: |
  make ci          # the full local gate: fmt-check, spdx, lint, test, cover, tidy-check
  make test        # go test -race with coverage.out
  make lint        # golangci-lint v2.15.0 with .golangci.yml
  make build       # build bin/starboard
  goreleaser release --snapshot --clean   # local release dry run into dist/
# Hand-curated agent configs that sync must not regenerate (doctor and
# sync report them as curated, diff-standards still previews changes):
# managed:
#   CLAUDE.md: false
# Git hook manager owning post-merge/commit-msg: standards (default,
# native hooks written by setup.sh) | lefthook | husky | custom.
# hooks: custom
# Agent worktree root (proc-04 Worktree Hygiene): one gitignored directory
# per repo; setup ignores it, the pre-commit guard refuses commits under it,
# doctor and worktree-gc report what lives there. Default .claude/worktrees.
# worktree_dir: .claude/worktrees
# Conventional Commits enforcement — uncomment to tune. Defaults: the last
# 50 non-merge commits locally; the PR's own commits in the standards-review
# action. Precedence: since > PR range (CI) > window, so a window only
# applies when no range is available and never widens a PR check.
# commits:
#   window: 50             # inspect the last N non-merge commits
#   since: origin/main     # or inspect <ref>..HEAD
#   scopes: [api, domain]  # allow-list for scoped commits
