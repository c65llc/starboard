# The screen registry.

# Files left out on purpose.
unmapped:
  - reason: debug only
    path: ios/DebugView.swift
screens:
  # Editing an activity.
  activity.editor:
    status: proposed
    presentation: sheet
    area: activity
    title: Activity editor
    layout:
      - kind: field
        region: name
        label: Name
      - {kind: primary-action, region: save, label: Save, to: trip.timeline}
  trip.timeline:
    title: Timeline
    area: trip
    purpose: The trip's days in order with each day's activities.
    presentation: root
    platforms: [ios, web]
    files:
      ios: [ios/TimelineView.swift]
    layout:
      - region: tabs
        kind: tabs
        items:
          - {label: Timeline, to: trip.timeline}
          - label: Map
            to: trip.map
            status: proposed
      - region: days
        kind: list
        item:
          kind: card
          region: day
          label: Day · place
        empty:
          label: No days yet
      - region: add-activity
        kind: primary-action
        label: Add an activity to this day of the trip, with a time, a place and notes
        to: activity.editor
    layouts:
      web-wide:
        - region: shell
          kind: row
          children:
            - {region: side, kind: nav, items: [{label: Days, to: trip.timeline}]}
            - {region: main, kind: section, width: "2/3"}
  admin.settings:
    title: Settings
    area: admin
    presentation: push
  trip.map:
    title: Map
    area: trip
    presentation: tab
