#
# Publish the website (starboard.c65llc.com): move the `live` branch, then
# deploy it to the `starboard` Cloudflare Worker.
#
# `live` holds the BUILT site, one orphan commit. The `starboard` Worker
# (static assets only, website/wrangler.jsonc) serves it on its custom
# domain; Cloudflare builds nothing and watches no branch. This site cannot
# be built there anyway (the flow diagrams are drawn in Playwright's Chromium
# at build time), so this workflow builds it, pushes it to `live` and deploys
# that commit:
#
#   resolve  (read-only) decides whether to publish, which commit to build and
#            which version the site shows; it skips, with a notice, a
#            pre-release, a release that is not the highest stable one (so
#            `live` never moves back to an older series), a run from a branch
#            other than main, and anything before the first stable release;
#   build    site.yml, the same build and checks as CI (site-check, links,
#            CSP tests, Playwright and axe), which uploads website/dist as an
#            artifact only when all of them pass; read-only token;
#   publish  (the only job with contents: write, and it runs no project code)
#            downloads the artifact, refuses one holding any `.git*` path (in
#            any case) or missing a file the site needs, and replaces `live`
#            with ONE orphan commit whose tree is exactly the built site (so
#            `live` never accumulates history), pushed with
#            --force-with-lease against the head it read: if `live` moved
#            meanwhile, the push fails and the run fails. The git directory
#            lives outside the artifact. It refuses to replace a newer
#            version than its own (each commit records `Starboard-Version:`)
#            and to publish a version that is no longer the newest stable
#            tag; it looks at the tags again after pushing and warns (green)
#            if a newer one appeared meanwhile, whose own release run
#            publishes it. An unchanged tree is not pushed. The token
#            reaches git only for the ls-remote, fetch and push. Its output
#            `commit` is the live commit holding this build (the one pushed,
#            or live's head when unchanged).
#   deploy   (contents: read; environment cloudflare-prod; the only job that
#            runs wrangler) first checks the commit is still live's head: if
#            a later publish moved live, it skips (green), since that
#            publish's deploy ships the newer site. It fails with an error if
#            the environment's CLOUDFLARE_API_TOKEN secret or
#            CLOUDFLARE_ACCOUNT_ID variable is missing. It checks out exactly
#            that commit into website/live, refuses a tree with a `.git*` path
#            (in any case) or missing index.html, 404.html or _headers,
#            installs wrangler from website/deploy's lockfile
#            (--frozen-lockfile) and runs
#            `wrangler deploy --config website/wrangler.jsonc`. Its own
#            concurrency group (deploy-live) serialises deploys. Because an
#            unchanged tree still deploys live's head, running the workflow
#            again repairs a failed deploy.
#
# What moves `live` and deploys it (and nothing else does):
#   - a stable release: release.yml calls this workflow (workflow_call, input
#     `tag`) once the release is published, because a release published with
#     the GITHUB_TOKEN raises no `release` event; `release: published` covers
#     a release published any other way. Both build the TAGGED commit.
#   - a push to main that touches a blog post (website/src/content/docs/blog/):
#     builds main, showing the newest stable release's version.
#   - workflow_dispatch from main: builds main as above, or, given `tag`, that
#     release's commit.
# A blog-post or by-hand publish therefore also carries whatever else main
# holds since the last release (docs included); see docs/releasing.md.
# Actions are pinned to a full commit SHA; wrangler and its dependencies by
# website/deploy/pnpm-lock.yaml.
name: Publish site

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'website/src/content/docs/blog/**'
  workflow_dispatch:
    inputs:
      tag:
        description: A stable release tag (vX.Y.Z) to publish; empty publishes main with the newest stable release's version.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: The stable release tag (vX.Y.Z) to publish.
        type: string
        required: true
    # deploy reads CLOUDFLARE_API_TOKEN from the cloudflare-prod environment,
    # but a called workflow still sees only the secrets its caller passes by
    # name (release.yml does).
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.r.outputs.publish }}
      ref: ${{ steps.r.outputs.ref }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, to find the newest stable release
      - name: What to publish
        id: r
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          # workflow_call and workflow_dispatch: inputs.tag; release: the
          # release's tag. In a called workflow github.event_name is the
          # caller's (push), so inputs.tag is checked first.
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not publishing: $1"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          newest=$(git tag -l 'v*.*.*' | grep -E "$stable" | sort -V | tail -n 1 || true)
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$EVENT" = release ]; then
            if [ "$PRERELEASE" = true ]; then skip "the release is a pre-release"; fi
            tag="$RELEASE_TAG"
          fi
          if [ -n "$tag" ]; then
            # Validated before it is ever echoed: a dispatch input is free text.
            if [[ ! "$tag" =~ $stable ]]; then skip "the tag given is not a stable release tag (vX.Y.Z)"; fi
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist"; exit 1
            fi
            # Never move backward: a patch to an older series (v0.1.5 after
            # v0.2.0) leaves the site on the newest release.
            if [ "$tag" != "$newest" ]; then skip "$tag is not the newest stable release ($newest is)"; fi
            ref=$(git rev-parse "refs/tags/$tag^{commit}")
            version="$tag"
          else
            if [ "$REF" != refs/heads/main ]; then skip "only main is published ($REF is not)"; fi
            if [ -z "$newest" ]; then skip "there is no stable release yet"; fi
            ref="$SHA"
            version="$newest"
          fi
          echo "Publishing $ref as $version ($EVENT)"
          {
            echo "publish=true"
            echo "ref=$ref"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.version }}
      artifact: site-dist

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the `live` branch
    outputs:
      # The `live` commit that holds this build: the one pushed, or, when
      # live already held this exact tree, live's current head.
      commit: ${{ steps.live.outputs.commit }}
    # One publish at a time; a queued one waits rather than cancels. Builds
    # can still finish out of order, so the step below also refuses to
    # replace a newer version than its own.
    concurrency:
      group: publish-live
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site
      - name: Commit the built site to live
        id: live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE: ${{ needs.resolve.outputs.ref }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$VERSION" =~ $stable ]] || fail "the version to publish is not vX.Y.Z"

          # The artifact is data, never git metadata: a .git directory or
          # file would be git config (hooks, fsmonitor) in the one job that
          # can write, and .gitignore/.gitattributes would change what is
          # published. -iname: `.GIT` is `.git` on a case-insensitive file
          # system (macOS, Windows), where a maintainer checks live out. It
          # also refuses `.github/`, `.gitkeep` and the like, deliberately:
          # nothing the site is built from (docs/<sections>, examples'
          # wireframes, web/app/dist, website/public, internal/schema) holds
          # a dotfile, so any such path is a mistake upstream, and failing
          # closed costs one fix there rather than a guess here about which
          # .git* names are harmless.
          n=$(find site -iname '.git*' | wc -l | tr -d ' ')
          [ "$n" -eq 0 ] || fail "the artifact holds $n .git* path(s); refusing to publish"
          for f in index.html _headers app/index.html app/core/starboard.wasm \
                   schema/v1/config.json schema/v1/screens.json; do
            [ -f "site/$f" ] || fail "the artifact has no $f"
          done
          # Only header lines count: the file's own comments name the placeholders.
          if grep -v '^[[:space:]]*#' site/_headers | grep -q '__CSP_'; then
            fail "_headers still holds a __CSP_ placeholder"
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          url="$SERVER/$REPO.git"
          gd="$RUNNER_TEMP/live.git"
          git init -q --bare "$gd"
          g() {
            git --git-dir="$gd" --work-tree=site -c core.autocrlf=false \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' "$@"
          }
          gauth() { g -c "http.$SERVER/.extraheader=AUTHORIZATION: basic $auth" "$@"; }

          newest_tag() {
            gauth ls-remote --tags --refs "$url" 'v*' | cut -f2 | sed 's#^refs/tags/##' \
              | { grep -E "$stable" || true; } | sort -V | tail -n 1
          }
          # Out-of-order builds: only the newest stable release's version
          # may be published.
          newest=$(newest_tag) || fail "could not list the repository's tags; not publishing"
          [ "$VERSION" = "$newest" ] || fail "$VERSION is no longer the newest stable release ($newest is); not publishing"

          g add -A -f .
          tree=$(g write-tree)
          parent=$(gauth ls-remote "$url" refs/heads/live | cut -f1)
          if [ -n "$parent" ]; then
            gauth fetch -q --depth=1 "$url" "$parent"
            if [ "$(g rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "::notice::live ($parent) already holds this build; nothing to publish"
              echo "commit=$parent" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            live_version=$(g show -s --format='%(trailers:key=Starboard-Version,valueonly)' "$parent" | head -n 1 | tr -d '[:space:]')
            if [[ "$live_version" =~ $stable ]] && [ "$live_version" != "$VERSION" ] \
               && [ "$(printf '%s\n%s\n' "$live_version" "$VERSION" | sort -V | tail -n 1)" = "$live_version" ]; then
              fail "live holds $live_version, newer than $VERSION; not replacing it"
            fi
          fi
          msg=$(printf 'publish: %s from %s\n\nBuilt from %s by %s\n\nStarboard-Version: %s\n' \
            "$VERSION" "${SOURCE:0:12}" "$SOURCE" "$RUN_URL" "$VERSION")
          # Always an orphan: live holds exactly one commit, the current site.
          commit=$(g commit-tree "$tree" -m "$msg")
          # Lease on the head read above (empty: live must not exist yet). If
          # live moved since, the push is rejected and the run fails.
          gauth push --force-with-lease="refs/heads/live:$parent" "$url" "$commit:refs/heads/live"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "::notice::live -> $commit ($VERSION from $SOURCE)"

          # The tag check above and the push are not atomic, and git cannot
          # make them so: --atomic and --force-with-lease cover only refs
          # this push names, and no lease can say "no tag newer than
          # $VERSION exists" because the new tag's name is unknown. So look
          # again, after the push. A stable tag that appeared in between has
          # its own release run, which calls this workflow; its publish job
          # waits behind this one (concurrency group publish-live) and then
          # replaces live, since its version is newer. This run stays green
          # and deploys: what it pushed was the newest release when it
          # checked, and no older than what live held. It only reports. (A
          # tag whose release run fails never publishes; nor should it.)
          # live has moved: a failed lookup must not fail the run (deploy
          # would then skip the build live now holds), so it only warns too.
          if ! after=$(newest_tag); then
            echo "::warning::could not list the tags again after pushing $VERSION; check that no newer stable tag needs publishing"
          elif [ "$after" != "$VERSION" ]; then
            echo "::warning::$after was tagged while $VERSION was being published; live holds $VERSION until $after's release publishes it (or run Publish site with tag $after)"
          fi

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: wrangler is third-party code and never runs beside a write
    # token. The GITHUB_TOKEN here can only read the repository.
    permissions:
      contents: read
    # The Cloudflare token (secret) and account ID (variable) live in this
    # environment, which only main and v* tags may use (docs/releasing.md),
    # so a dispatch from another branch cannot read them.
    environment: cloudflare-prod
    # Its own group: deploys never overlap one another. A queued deploy that
    # a newer one replaces is cancelled (and its run shows it); the newer one
    # deploys live's head, which is at least as new.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      # First, before fetching anything: if a later publish has moved live,
      # that publish's own deploy ships the newer site, so this one skips
      # (green) rather than taking the site back to an older build, or
      # failing to fetch an orphan commit live no longer points at.
      - name: Is this still live's head?
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::publish gave no live commit to deploy"; exit 1; }
          head=$(gh api "repos/$REPO/git/ref/heads/live" --jq .object.sha)
          if [ "$head" = "$COMMIT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::live moved to $head since $COMMIT was published; its own deploy ships it"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the Cloudflare settings
        if: steps.head.outputs.deploy == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ "$HAS_TOKEN" = true ] || { echo "::error::the CLOUDFLARE_API_TOKEN secret of the cloudflare-prod environment is not set (or not passed by the caller); live was not deployed (docs/releasing.md)"; exit 1; }
          [ -n "$ACCOUNT_ID" ] || { echo "::error::the CLOUDFLARE_ACCOUNT_ID variable of the cloudflare-prod environment is not set; live was not deployed (docs/releasing.md)"; exit 1; }
      # From the workflow's own commit: wrangler.jsonc, and website/deploy,
      # whose lockfile pins wrangler and every dependency.
      - if: steps.head.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            website/wrangler.jsonc
            website/.nvmrc
            website/deploy/
          sparse-checkout-cone-mode: false
      # The exact commit publish pushed (or found already on live), into the
      # assets directory wrangler.jsonc names.
      - if: steps.head.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publish.outputs.commit }}
          path: website/live
      - name: Check the tree to deploy
        if: steps.head.outputs.deploy == 'true'
        env:
          COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # Only the site is uploaded: checkout's git directory is not part of it.
          rm -rf website/live/.git
          # -iname, as in publish (the reasons are there).
          n=$(find website/live -iname '.git*' | wc -l | tr -d ' ')
          [ "$n" -eq 0 ] || fail "live ($COMMIT) holds $n .git* path(s); refusing to deploy"
          for f in index.html 404.html _headers; do
            [ -f "website/live/$f" ] || fail "live ($COMMIT) has no $f; refusing to deploy"
          done
      - if: steps.head.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      # No token in this step. The lockfile fixes every version; pnpm also
      # enforces the 3-day minimumReleaseAge and runs no install scripts.
      - name: Install wrangler (website/deploy, frozen lockfile)
        if: steps.head.outputs.deploy == 'true'
        working-directory: website/deploy
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Deploy live to the starboard Worker
        if: steps.head.outputs.deploy == 'true'
        working-directory: website/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config ../wrangler.jsonc
          echo "::notice::deployed live ($COMMIT) to the starboard Worker"
