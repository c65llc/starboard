# Copyright 2026 C65 LLC
#
# CI. The test and lint jobs are the Go gate `make ci` runs: tests with
# the race detector on all three platforms, then lint, go vet of the
# js/wasm entry point, gofmt, SPDX headers,
# the 95% per-package coverage floor (every package with statements
# measured), a tidy, committed go.mod and go.sum, clean example
# projects and current region-kind pictures in the docs on Linux. The
# actionlint job lints the workflows (make actionlint). The web job, which `make web-test web-e2e` runs
# locally, builds starboard.wasm and tests it and @c65llc/starboard-core,
# size budget included, then builds the PWA and runs its Playwright tests,
# on Linux. The vscode job, `make vscode-test`, runs the VS Code
# extension's integration tests in VS Code 1.105.0 under xvfb-run, then
# packages it (make vscode-package) and checks the .vsix, when a change
# touches web/ or what the extension is built from. The desktop job,
# `make desktop-test`, runs the desktop app's cargo tests and the tauri
# host's Vitest, then clippy and a build of the app, on Linux (Ubuntu
# 22.04), macOS and Windows, when a change touches what it is built from.
# The site job
# (site.yml) builds and checks starboard.c65llc.com when a change touches
# what it is built from. Actions are pinned to a full
# commit SHA.
# `CI Gate` (coding-standards templates/ci-gate.yml.example, arch-08 §3) is
# the one job to mark as a required status check: it passes only when every
# other job passed, so adding a matrix entry never means editing the ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installs the pinned release binary on PATH; `make lint` then runs it,
      # so CI and a local `make lint` use the same command.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Lint, format, SPDX and coverage
        run: make lint wasm-vet fmt-check spdx cover
      - name: Every example project lints clean with --strict
        run: make examples-check
      - name: The region-kind pictures in docs/reference/kinds are current
        run: make docs-kinds-check
      - name: go.mod and go.sum are tidy and committed
        run: make tidy-check

  # The workflows themselves, publish.yml and release.yml included, which no
  # other job exercises: actionlint (its version pinned in the Makefile)
  # with shellcheck, which ubuntu-latest provides, over every run: script.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: make actionlint

  # The web workspace: the WebAssembly bundle and @c65llc/starboard-core.
  # The core tests compare the bundle against the CLI, so both are built
  # first (make web-test runs the same steps locally). pnpm comes from the
  # packageManager pin in web/package.json through corepack, which reads
  # the package.json nearest the working directory, so the pnpm steps run
  # in web/ rather than as `pnpm -C web` from the root.
  # `pnpm build` builds core and then the PWA (web/app, pnpm -r runs them
  # in dependency order); Playwright then runs the PWA's e2e tests on
  # Chromium, WebKit and Firefox (Firefox the view-only specs, as
  # web/app/playwright.config.ts says) against `vite preview` of that
  # build. Browsers are downloaded fresh each run (no cache), with their OS
  # dependencies.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Build the CLI and starboard.wasm
        run: make build wasm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Lint (ESLint and tsc --noEmit)
        run: pnpm lint
        working-directory: web
      - name: Build
        run: pnpm build
        working-directory: web
      # After Build: web/app's budget test measures dist/, and with CI set
      # it fails, rather than skips, when there is no build.
      - name: Test (includes the size budgets)
        run: pnpm test
        working-directory: web
      - name: Install Playwright's Chromium, WebKit and Firefox
        run: pnpm exec playwright install --with-deps chromium webkit firefox
        working-directory: web/app
      - name: End-to-end tests (web/app)
        run: pnpm e2e
        working-directory: web/app

  # The extension in a real VS Code, when the change touches it (changes
  # says what that is): @vscode/test-electron downloads the pinned 1.105.0,
  # and xvfb-run gives it a display.
  vscode:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Enable corepack
        run: corepack enable
      # VS Code is pinned to 1.105.0 in runTest.ts, so the download is the
      # same on every run: keep it rather than fetch it each time.
      - name: Cache the downloaded VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/vscode/.vscode-test/
          key: vscode-test-1.105.0-${{ runner.os }}
      - name: Integration tests (web/vscode)
        run: xvfb-run -a make vscode-test
      # Packaging, as release.yml's vscode-package job runs it, so a change
      # that breaks the .vsix fails here rather than at the next release.
      # The default version, 0.0.0-dev: a release stamps the tag's.
      - name: Package the extension and check the .vsix
        run: make vscode-package && sh scripts/check-vsix.sh web/vscode/starboard-vscode-0.0.0-dev.vsix 0.0.0-dev
      - name: Upload the VS Code logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-test-logs
          path: web/vscode/test-results/*/logs/
          retention-days: 14

  # The desktop app's Rust on each platform, with the runner's own rustup
  # (no toolchain action to pin) set to the toolchain the app is built with,
  # when the change touches it (changes says what that is). Linux needs
  # Tauri's prerequisites: WebKitGTK and friends, and a C toolchain
  # (build-essential); Ubuntu 22.04, the oldest glibc the Linux bundle
  # supports. The cargo registry and the target dir are cached by
  # Cargo.lock and the ISO week: a cache key is never overwritten, so the
  # week lets a fresh one be saved, restored from the last. On Windows,
  # confine's junction test runs (cmd.exe's mklink /J).
  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust 1.99.0, with clippy
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
      - name: The week, for the cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo's registry and the target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            web/desktop/src-tauri/target/
          key: desktop-${{ runner.os }}-rust-1.99.0-${{ hashFiles('web/desktop/src-tauri/Cargo.lock') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            desktop-${{ runner.os }}-rust-1.99.0-${{ hashFiles('web/desktop/src-tauri/Cargo.lock') }}-
      - name: Test (cargo test and the tauri host's Vitest)
        run: make desktop-test
      - name: Clippy, warnings as errors
        run: cargo clippy --locked --all-targets --manifest-path web/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: Build the app
        run: cargo build --locked --manifest-path web/desktop/src-tauri/Cargo.toml

  # The release's bundle path on pull requests: every bundle the release
  # attaches, each on its own OS, with the same stamp, build, staging names
  # and check as release.yml's desktop-bundle job, at the placeholder version
  # 0.0.0. Nothing is uploaded: the bundles are unsigned test builds.
  desktop-bundle:
    name: desktop-bundle (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: dmg
            args: --bundles dmg --target universal-apple-darwin
            made: universal-apple-darwin/release/bundle/dmg/*.dmg
            name: Starboard_0.0.0_universal.dmg
          - os: windows-latest
            kind: exe
            args: --bundles nsis
            made: release/bundle/nsis/*-setup.exe
            name: Starboard_0.0.0_x64-setup.exe
          - os: ubuntu-22.04
            kind: appimage
            args: --bundles appimage
            made: release/bundle/appimage/*.AppImage
            name: Starboard_0.0.0_amd64.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: The universal macOS build needs both Apple targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Stamp the placeholder version
        run: sh scripts/stamp-desktop-version.sh 0.0.0
      - name: Build the bundle
        env:
          ARGS: ${{ matrix.args }}
          # linuxdeploy is an AppImage itself; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          make desktop-app
          cd web/desktop
          # shellcheck disable=SC2086 # ARGS is a flag list, on purpose
          pnpm tauri build $ARGS -- --locked
      - name: Stage it under its release name and check it
        env:
          MADE: ${{ matrix.made }}
          NAME: ${{ matrix.name }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p web/desktop/bundles
          # shellcheck disable=SC2086 # MADE is a glob, on purpose
          set -- web/desktop/src-tauri/target/$MADE
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected one $MADE, found: $*"
            exit 1
          fi
          cp "$1" "web/desktop/bundles/$NAME"
          sh scripts/check-desktop-bundles.sh 0.0.0 web/desktop/bundles "$KIND"

  # Whether the website has to be rebuilt and checked: true when the change
  # touches anything the site is built from or checks against, which is
  # nearly everything but other workflows and repository metadata. The rule
  # IDs and schemas come from internal/, so a new rule without its page, or
  # a changed schema, fails the site job (docs and binary never drift). The
  # vscode job runs when the change touches web/, or what the extension is
  # built and tested from: the Go core it bundles as starboard.wasm, the
  # examples its tests copy, the Makefile, scripts/check-vsix.sh and this
  # workflow. The desktop job runs when the change touches web/ (the app it
  # builds, the tauri host and web/desktop itself), the Go core it bundles
  # as starboard.wasm (internal/config also writes the content scanner's
  # golden), the Makefile or this workflow. A push with no usable "before"
  # commit (a new branch) runs them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
      vscode: ${{ steps.diff.outputs.vscode }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Files the change touches
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ "$EVENT" != pull_request ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            { echo "site=true"; echo "vscode=true"; echo "desktop=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(website/|docs/|examples/|web/|internal/|cmd/|skills/|LICENSE$|Makefile$|go\.(mod|sum)$|\.github/workflows/(ci|site)\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -Eq '^(web/|examples/|internal/|cmd/|core/|Makefile$|scripts/check-vsix\.sh$|go\.(mod|sum)$|\.github/workflows/ci\.yml$)'; then
            echo "vscode=true" >> "$GITHUB_OUTPUT"
          else
            echo "vscode=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -Eq '^(web/|internal/|cmd/|Makefile$|scripts/(check|stamp)-desktop-.*\.sh$|go\.(mod|sum)$|\.github/workflows/(ci|release)\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # The website, when the change touches it (site.yml says what it checks).
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml

  # The ONLY job to list as a required status check: it passes only when
  # every other job passed, or, for the site, vscode and desktop jobs alone, was
  # skipped because nothing it is built from changed. It gives the ruleset one stable
  # check name across matrix changes and path routing.
  ci-gate:
    name: CI Gate
    needs: [test, lint, actionlint, web, changes, site, vscode, desktop, desktop-bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          LANE_RESULTS: ${{ needs.test.result }} ${{ needs.lint.result }} ${{ needs.actionlint.result }} ${{ needs.web.result }} ${{ needs.changes.result }}
          SITE_RESULT: ${{ needs.site.result }}
          SITE_WANTED: ${{ needs.changes.outputs.site }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
          VSCODE_WANTED: ${{ needs.changes.outputs.vscode }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_WANTED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_BUNDLE_RESULT: ${{ needs.desktop-bundle.result }}
        run: |
          set -euo pipefail
          echo "Job results: $LANE_RESULTS; site: $SITE_RESULT (needed: $SITE_WANTED); vscode: $VSCODE_RESULT (needed: $VSCODE_WANTED); desktop: $DESKTOP_RESULT (needed: $DESKTOP_WANTED); desktop-bundle: $DESKTOP_BUNDLE_RESULT"
          for r in $LANE_RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::A CI job did not succeed: $LANE_RESULTS"
              exit 1
            fi
          done
          # A routed job passes the gate when it succeeded, or was skipped
          # because nothing it is built from changed.
          routed() {
            local name=$1 result=$2 wanted=$3
            if [ "$result" = skipped ] && [ "$wanted" = false ]; then return 0; fi
            if [ "$result" != success ]; then
              echo "::error::The $name job did not succeed: $result"
              return 1
            fi
          }
          routed site "$SITE_RESULT" "$SITE_WANTED"
          routed vscode "$VSCODE_RESULT" "$VSCODE_WANTED"
          routed desktop "$DESKTOP_RESULT" "$DESKTOP_WANTED"
          routed desktop-bundle "$DESKTOP_BUNDLE_RESULT" "$DESKTOP_WANTED"
